name: Zork I House of Records Roadmap

on:
  push:
    branches:
      - agent/house-of-records-program
      - agent/glulx-house-state-foundation
      - agent/glulx-living-room-museum
      - agent/glulx-house-kitchen-laboratory
      - agent/glulx-house-cellar-threshold
      - agent/glulx-house-correspondence-visitors
      - agent/glulx-attic-archive-core
      - agent/glulx-attic-npc-dossiers
      - agent/glulx-attic-area-case-files
    paths:
      - "expanded/docs/HOUSE_OF_RECORDS_PROGRAM.md"
      - "expanded/docs/HOUSE_OF_RECORDS_HANDOFF.md"
      - "glulx/**/README.md"
      - ".beads/issues-zork-house-of-records-*.jsonl"
      - ".beads/onyx_zork_*.beadtrain"
      - ".github/workflows/house-of-records-roadmap.yml"
  pull_request:
    paths:
      - "expanded/docs/HOUSE_OF_RECORDS_PROGRAM.md"
      - "expanded/docs/HOUSE_OF_RECORDS_HANDOFF.md"
      - "glulx/**/README.md"
      - ".beads/issues-zork-house-of-records-*.jsonl"
      - ".beads/onyx_zork_*.beadtrain"
      - ".github/workflows/house-of-records-roadmap.yml"

permissions:
  contents: read

jobs:
  validate-house-of-records-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all House of Records trains
        run: |
          set -euo pipefail
          for train in \
            .beads/onyx_zork_house_state_foundation.beadtrain \
            .beads/onyx_zork_house_living_museum.beadtrain \
            .beads/onyx_zork_house_kitchen_laboratory.beadtrain \
            .beads/onyx_zork_house_cellar_threshold.beadtrain \
            .beads/onyx_zork_house_correspondence_visitors.beadtrain \
            .beads/onyx_zork_attic_archive_core.beadtrain \
            .beads/onyx_zork_attic_npc_dossiers.beadtrain \
            .beads/onyx_zork_attic_area_case_files.beadtrain \
            .beads/onyx_zork_attic_playback.beadtrain \
            .beads/onyx_zork_house_rest_and_dreams.beadtrain \
            .beads/onyx_zork_house_vulnerability.beadtrain \
            .beads/onyx_zork_expedition_archive.beadtrain
          do
            python .beads/beadtrains/scripts/validate_sharded_beadtrain.py "$train"
          done

      - name: Verify roadmap counts and sequential completion
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          shards = sorted(Path('.beads').glob('issues-zork-house-of-records-*.jsonl'))
          issues = []
          for shard in shards:
              issues.extend(
                  json.loads(line)
                  for line in shard.read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )

          trains = [
              ('house-state', '.beads/onyx_zork_house_state_foundation.beadtrain'),
              ('house-museum', '.beads/onyx_zork_house_living_museum.beadtrain'),
              ('house-kitchen', '.beads/onyx_zork_house_kitchen_laboratory.beadtrain'),
              ('house-cellar', '.beads/onyx_zork_house_cellar_threshold.beadtrain'),
              ('house-mail', '.beads/onyx_zork_house_correspondence_visitors.beadtrain'),
              ('attic-core', '.beads/onyx_zork_attic_archive_core.beadtrain'),
              ('attic-npc', '.beads/onyx_zork_attic_npc_dossiers.beadtrain'),
              ('attic-area', '.beads/onyx_zork_attic_area_case_files.beadtrain'),
              ('attic-playback', '.beads/onyx_zork_attic_playback.beadtrain'),
              ('house-rest', '.beads/onyx_zork_house_rest_and_dreams.beadtrain'),
              ('house-risk', '.beads/onyx_zork_house_vulnerability.beadtrain'),
              ('expedition', '.beads/onyx_zork_expedition_archive.beadtrain'),
          ]

          assert len(shards) == 4
          assert len(issues) == 96
          assert len({item['id'] for item in issues}) == 96
          assert len(trains) == 12

          issue_by_id = {item['id']: item for item in issues}
          seen_planned = False
          expected_closed = 0

          for prefix, train_path in trains:
              path = Path(train_path)
              assert path.is_file(), train_path
              with path.open('rb') as handle:
                  train = tomllib.load(handle)['train']

              ids = [f'zork1-{prefix}-{number:03d}' for number in range(1, 9)]
              statuses = [issue_by_id[item_id]['status'] for item_id in ids]
              status = train['status']

              if status == 'complete':
                  assert not seen_planned, f'{train_path} completes after a planned train'
                  assert statuses == ['closed'] * 8, (train_path, statuses)
                  expected_closed += 8
              elif status == 'planned':
                  seen_planned = True
                  assert statuses == ['open'] * 8, (train_path, statuses)
              else:
                  raise AssertionError(
                      f'{train_path} must be complete or planned at a closure head, got {status!r}'
                  )

          closed = [item for item in issues if item['status'] == 'closed']
          open_items = [item for item in issues if item['status'] == 'open']
          assert len(closed) == expected_closed
          assert len(open_items) == 96 - expected_closed

          for required in (
              'expanded/docs/HOUSE_OF_RECORDS_PROGRAM.md',
              'expanded/docs/HOUSE_OF_RECORDS_HANDOFF.md',
              'glulx/house-state-foundation/README.md',
              'glulx/living-room-museum/README.md',
              'glulx/house-kitchen-laboratory/README.md',
              'glulx/house-cellar-threshold/README.md',
              'glulx/house-correspondence-visitors/README.md',
          ):
              assert Path(required).is_file()

          print(
              'House of Records roadmap validated: '
              f'12 trains / 96 beads / {len(closed)} closed / {len(open_items)} open'
          )
          PY
