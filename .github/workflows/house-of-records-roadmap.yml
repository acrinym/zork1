name: Zork I House of Records Roadmap

on:
  push:
    branches:
      - agent/house-of-records-program
      - agent/glulx-house-state-foundation
      - agent/glulx-living-room-museum
      - agent/glulx-house-kitchen-laboratory
      - agent/glulx-house-cellar-threshold
      - agent/glulx-house-correspondence-visitors
    paths:
      - "expanded/docs/HOUSE_OF_RECORDS_PROGRAM.md"
      - "expanded/docs/HOUSE_OF_RECORDS_HANDOFF.md"
      - "glulx/house-state-foundation/README.md"
      - "glulx/living-room-museum/README.md"
      - "glulx/house-kitchen-laboratory/README.md"
      - "glulx/house-cellar-threshold/README.md"
      - "glulx/house-correspondence-visitors/README.md"
      - ".beads/issues-zork-house-of-records-*.jsonl"
      - ".beads/onyx_zork_house_*.beadtrain"
      - ".beads/onyx_zork_attic_*.beadtrain"
      - ".beads/onyx_zork_expedition_archive.beadtrain"
      - ".github/workflows/house-of-records-roadmap.yml"
  pull_request:
    paths:
      - "expanded/docs/HOUSE_OF_RECORDS_PROGRAM.md"
      - "expanded/docs/HOUSE_OF_RECORDS_HANDOFF.md"
      - "glulx/house-state-foundation/README.md"
      - "glulx/living-room-museum/README.md"
      - "glulx/house-kitchen-laboratory/README.md"
      - "glulx/house-cellar-threshold/README.md"
      - "glulx/house-correspondence-visitors/README.md"
      - ".beads/issues-zork-house-of-records-*.jsonl"
      - ".beads/onyx_zork_house_*.beadtrain"
      - ".beads/onyx_zork_attic_*.beadtrain"
      - ".beads/onyx_zork_expedition_archive.beadtrain"
      - ".github/workflows/house-of-records-roadmap.yml"

permissions:
  contents: read

jobs:
  validate-house-of-records-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all House of Records trains
        run: |
          set -euo pipefail
          for train in \
            .beads/onyx_zork_house_state_foundation.beadtrain \
            .beads/onyx_zork_house_living_museum.beadtrain \
            .beads/onyx_zork_house_kitchen_laboratory.beadtrain \
            .beads/onyx_zork_house_cellar_threshold.beadtrain \
            .beads/onyx_zork_house_correspondence_visitors.beadtrain \
            .beads/onyx_zork_attic_archive_core.beadtrain \
            .beads/onyx_zork_attic_npc_dossiers.beadtrain \
            .beads/onyx_zork_attic_area_case_files.beadtrain \
            .beads/onyx_zork_attic_playback.beadtrain \
            .beads/onyx_zork_house_rest_and_dreams.beadtrain \
            .beads/onyx_zork_house_vulnerability.beadtrain \
            .beads/onyx_zork_expedition_archive.beadtrain
          do
            python .beads/beadtrains/scripts/validate_sharded_beadtrain.py "$train"
          done

      - name: Verify roadmap counts and incremental completion
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          shards = sorted(Path('.beads').glob('issues-zork-house-of-records-*.jsonl'))
          issues = []
          for shard in shards:
              issues.extend(
                  json.loads(line)
                  for line in shard.read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )

          train_paths = sorted(Path('.beads').glob('onyx_zork_house_*.beadtrain'))
          train_paths += sorted(Path('.beads').glob('onyx_zork_attic_*.beadtrain'))
          train_paths += [Path('.beads/onyx_zork_expedition_archive.beadtrain')]
          unique_trains = {path.resolve() for path in train_paths}

          assert len(shards) == 4
          assert len(issues) == 96
          assert len({item['id'] for item in issues}) == 96
          assert len(unique_trains) == 12

          issue_by_id = {item['id']: item for item in issues}
          foundation_ids = [f'zork1-house-state-{n:03d}' for n in range(1, 9)]
          museum_ids = [f'zork1-house-museum-{n:03d}' for n in range(1, 9)]
          kitchen_ids = [f'zork1-house-kitchen-{n:03d}' for n in range(1, 9)]
          cellar_ids = [f'zork1-house-cellar-{n:03d}' for n in range(1, 9)]
          mail_ids = [f'zork1-house-mail-{n:03d}' for n in range(1, 9)]
          active_ids = set(foundation_ids + museum_ids + kitchen_ids + cellar_ids + mail_ids)
          later = [item for item in issues if item['id'] not in active_ids]
          assert all(item['status'] == 'open' for item in later)

          for ids in (foundation_ids, museum_ids, kitchen_ids, cellar_ids):
              assert [issue_by_id[item]['status'] for item in ids] == ['closed'] * 8

          paths = {
              'foundation': Path('.beads/onyx_zork_house_state_foundation.beadtrain'),
              'museum': Path('.beads/onyx_zork_house_living_museum.beadtrain'),
              'kitchen': Path('.beads/onyx_zork_house_kitchen_laboratory.beadtrain'),
              'cellar': Path('.beads/onyx_zork_house_cellar_threshold.beadtrain'),
              'mail': Path('.beads/onyx_zork_house_correspondence_visitors.beadtrain'),
          }
          trains = {}
          for name, path in paths.items():
              with path.open('rb') as handle:
                  trains[name] = tomllib.load(handle)
          for name in ('foundation', 'museum', 'kitchen', 'cellar'):
              assert trains[name]['train']['status'] == 'complete'

          mail_status = trains['mail']['train']['status']
          mail_statuses = [issue_by_id[item]['status'] for item in mail_ids]
          if mail_status == 'in_progress':
              closed_prefix = 0
              for status in mail_statuses:
                  if status == 'closed':
                      closed_prefix += 1
                  else:
                      break
              assert closed_prefix <= 7
              assert mail_statuses == ['closed'] * closed_prefix + ['open'] * (8 - closed_prefix)
              expected_closed = 32 + closed_prefix
          elif mail_status == 'complete':
              assert mail_statuses == ['closed'] * 8
              expected_closed = 40
          else:
              raise AssertionError(f'Correspondence train must be in_progress or complete, got {mail_status!r}')

          closed = [item for item in issues if item['status'] == 'closed']
          open_items = [item for item in issues if item['status'] == 'open']
          assert len(closed) == expected_closed
          assert len(open_items) == 96 - expected_closed

          active_names = {path.name for path in paths.values()}
          for path in unique_trains:
              with path.open('rb') as handle:
                  data = tomllib.load(handle)
              if path.name not in active_names:
                  assert data['train']['status'] == 'planned'

          for required in (
              'expanded/docs/HOUSE_OF_RECORDS_PROGRAM.md',
              'expanded/docs/HOUSE_OF_RECORDS_HANDOFF.md',
              'glulx/house-state-foundation/README.md',
              'glulx/living-room-museum/README.md',
              'glulx/house-kitchen-laboratory/README.md',
              'glulx/house-cellar-threshold/README.md',
              'glulx/house-correspondence-visitors/README.md',
          ):
              assert Path(required).is_file()
          print(
              'House of Records roadmap validated: '
              f'12 trains / 96 beads / {len(closed)} closed / {len(open_items)} open'
          )
          PY
