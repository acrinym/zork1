name: Zork I Glulx Attic Archive Core

on:
  push:
    branches:
      - agent/glulx-attic-archive-core
    paths:
      - "glulx/attic-archive-core/**"
      - "glulx/house-correspondence-visitors/**"
      - "glulx/house-cellar-threshold/**"
      - "glulx/house-kitchen-laboratory/**"
      - "glulx/living-room-museum/**"
      - "glulx/house-state-foundation/**"
      - "glulx/room-density/**"
      - "glulx/material-consequences/**"
      - "glulx/ritual-resonance/**"
      - "glulx/dam-mechanisms/**"
      - "glulx/absurd-alternates/**"
      - "glulx/shadow-logic/**"
      - "glulx/reactive-surface/**"
      - "glulx/assistance/**"
      - "glulx/optimized/**"
      - "glulx/tools/**"
      - ".github/workflows/glulx-attic-archive-core.yml"
  pull_request:
    paths:
      - "glulx/attic-archive-core/**"
      - "glulx/tools/**"
      - ".github/workflows/glulx-attic-archive-core.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  ZORK_GLULX_COMMIT: 1ada70e58ac4933446b907d67949d9cab3119c0e
  ZORK_GLULX_TREE: 02b34128649bbb7fcddf99136e03fb67c032b089
  GLULX_ZILF_COMMIT: 45c60f1e37651f266ac92d49ae01748bb4909fa5
  GLAZER_SOURCE_URL: https://gitlab.com/andwj/glazer/-/archive/v1.2.0/glazer-v1.2.0.tar.gz
  GLAZER_SOURCE_SHA256: a45edadb140111b5df44a3f49ca4e2b8ec0550d63a6cdee7c93bec93a79ed482
  GLULXE_COMMIT: 56ab8743bab565de307bd892c555d8d8897ed517
  CHEAPGLK_COMMIT: 14d8aaf6e4150669762bd4646a5368e75c1eeee6
  ARCHIVE_SERIAL: "260729"
  ARCHIVE_TEST_SERIAL: "990324"
  ARCHIVE_FILE: zork1-glulx-attic-archive-core.ulx

jobs:
  qualify-glulx-attic-archive-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned Tara Glulx source
        uses: actions/checkout@v4
        with:
          repository: taradinoc/zork1
          ref: ${{ env.ZORK_GLULX_COMMIT }}
          path: .upstream/zork1-glulx
          persist-credentials: false
      - name: Check out pinned Glulx ZILF source
        uses: actions/checkout@v4
        with:
          repository: taradinoc/zilf
          ref: ${{ env.GLULX_ZILF_COMMIT }}
          path: .tooling/zilf-glulx
          persist-credentials: false
      - name: Check out pinned Glulxe
        uses: actions/checkout@v4
        with:
          repository: erkyrath/glulxe
          ref: ${{ env.GLULXE_COMMIT }}
          path: .tooling/glulxe
          persist-credentials: false
      - name: Check out pinned CheapGlk
        uses: actions/checkout@v4
        with:
          repository: erkyrath/cheapglk
          ref: ${{ env.CHEAPGLK_COMMIT }}
          path: .tooling/cheapglk
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install build and interpreter prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev curl
          python -m pip install pexpect
      - name: Qualify Release 1224 archive candidate
        id: qualify
        run: bash glulx/attic-archive-core/qualify.sh
      - name: Publish qualification receipt to PR 22
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFY_OUTCOME: ${{ steps.qualify.outcome }}
        run: |
          {
            echo "## Train 6 automated qualification"
            echo
            echo "Head: \`${GITHUB_SHA}\`"
            echo "Outcome: **${QUALIFY_OUTCOME}**"
            if test -f glulx/build/attic-archive-core/story-report.json; then
              echo
              echo '```json'
              cat glulx/build/attic-archive-core/story-report.json
              echo '```'
            fi
            if test -f glulx/build/attic-archive-core/QUALIFICATION-RECEIPT.json; then
              echo
              echo "Native archive qualification receipt was produced, including save/corrupt/restore."
            else
              echo
              echo "No final qualification receipt was produced; inspect the failed workflow step and uploaded logs."
            fi
          } > "$RUNNER_TEMP/train6-comment.md"
          gh pr comment 22 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/train6-comment.md"
      - name: Upload candidate artifact and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zork1-glulx-attic-archive-core-candidate
          path: |
            glulx/build/attic-archive-core/zork1-glulx-attic-archive-core.ulx
            glulx/build/attic-archive-core/zork1-glulx-attic-archive-core.asm
            glulx/build/attic-archive-core/story-report.json
            glulx/build/attic-archive-core/QUALIFICATION-RECEIPT.json
            glulx/build/attic-archive-core/SERIAL-NORMALIZATION.json
            glulx/build/attic-archive-core/TEST-SERIAL-NORMALIZATION.json
            glulx/build/attic-archive-core/src/STAGING-RECEIPT.json
            glulx/build/attic-archive-core/smell-report.json
            glulx/build/attic-archive-core/attic-archive-core-transcript.txt
            glulx/build/attic-archive-core/attic-archive-core-persistence-transcript.txt
            glulx/build/attic-archive-core/*.sav
            glulx/build/attic-archive-core/*-compile.log
            glulx/build/attic-archive-core/*-build.log
            glulx/build/attic-archive-core/*-assemble.log
            glulx/build/attic-archive-core/glazer-version.txt
            glulx/attic-archive-core/patch-series.json
            glulx/attic-archive-core/tests/attic_archive_core_persistence.json
          if-no-files-found: warn
