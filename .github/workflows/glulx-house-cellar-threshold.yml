name: Zork I Glulx House Cellar Threshold

on:
  push:
    branches:
      - agent/glulx-house-cellar-threshold
    paths:
      - "glulx/house-cellar-threshold/**"
      - "glulx/house-kitchen-laboratory/**"
      - "glulx/living-room-museum/**"
      - "glulx/house-state-foundation/**"
      - "glulx/room-density/**"
      - "glulx/material-consequences/**"
      - "glulx/ritual-resonance/**"
      - "glulx/dam-mechanisms/**"
      - "glulx/absurd-alternates/**"
      - "glulx/shadow-logic/**"
      - "glulx/reactive-surface/**"
      - "glulx/assistance/**"
      - "glulx/optimized/**"
      - "glulx/tools/**"
      - ".github/workflows/glulx-house-cellar-threshold.yml"
  pull_request:
    paths:
      - "glulx/house-cellar-threshold/**"
      - "glulx/house-kitchen-laboratory/**"
      - "glulx/living-room-museum/**"
      - "glulx/house-state-foundation/**"
      - "glulx/room-density/**"
      - "glulx/material-consequences/**"
      - "glulx/ritual-resonance/**"
      - "glulx/dam-mechanisms/**"
      - "glulx/absurd-alternates/**"
      - "glulx/shadow-logic/**"
      - "glulx/reactive-surface/**"
      - "glulx/assistance/**"
      - "glulx/optimized/**"
      - "glulx/tools/**"
      - ".github/workflows/glulx-house-cellar-threshold.yml"

permissions:
  contents: read

env:
  ZORK_GLULX_COMMIT: 1ada70e58ac4933446b907d67949d9cab3119c0e
  ZORK_GLULX_TREE: 02b34128649bbb7fcddf99136e03fb67c032b089
  GLULX_ZILF_COMMIT: 45c60f1e37651f266ac92d49ae01748bb4909fa5
  GLAZER_SOURCE_URL: https://gitlab.com/andwj/glazer/-/archive/v1.2.0/glazer-v1.2.0.tar.gz
  GLAZER_SOURCE_SHA256: a45edadb140111b5df44a3f49ca4e2b8ec0550d63a6cdee7c93bec93a79ed482
  BASE_RELEASE: "1221"
  BASE_ARTIFACT_SHA256: 93cb08f3571df3a63476609b6f1dc4eaeac7dd0255eb1ef1b7d878c8168dc62f
  CELLAR_RELEASE: "1222"
  CELLAR_SERIAL: "260724"

jobs:
  discover-glulx-house-cellar-threshold:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out pinned Tara Glulx source
        uses: actions/checkout@v4
        with:
          repository: taradinoc/zork1
          ref: ${{ env.ZORK_GLULX_COMMIT }}
          path: .upstream/zork1-glulx
          persist-credentials: false

      - name: Check out pinned Glulx ZILF source
        uses: actions/checkout@v4
        with:
          repository: taradinoc/zilf
          ref: ${{ env.GLULX_ZILF_COMMIT }}
          path: .tooling/zilf-glulx
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl

      - name: Discover Release 1222 production artifact
        run: bash glulx/house-cellar-threshold/discover.sh

      - name: Upload Release 1222 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zork1-glulx-house-cellar-threshold-discovery
          path: |
            glulx/build/house-cellar-threshold/zork1-glulx-house-cellar-threshold.ulx
            glulx/build/house-cellar-threshold/zork1-glulx-house-cellar-threshold.asm
            glulx/build/house-cellar-threshold/story-report.json
            glulx/build/house-cellar-threshold/DISCOVERY-RECEIPT.json
            glulx/build/house-cellar-threshold/SERIAL-NORMALIZATION.json
            glulx/build/house-cellar-threshold/src/STAGING-RECEIPT.json
            glulx/build/house-cellar-threshold/smell-report.json
            glulx/build/house-cellar-threshold/*-compile.log
            glulx/build/house-cellar-threshold/*-build.log
            glulx/build/house-cellar-threshold/*-restore.log
            glulx/build/house-cellar-threshold/*-assemble.log
            glulx/build/house-cellar-threshold/glazer-version.txt
            glulx/house-cellar-threshold/patch-series.json
          if-no-files-found: warn
