name: Zork I House Cellar Threshold Beadtrain

on:
  push:
    branches:
      - agent/glulx-house-cellar-threshold
    paths:
      - ".beads/onyx_zork_house_cellar_threshold.beadtrain"
      - ".beads/issues-zork-house-of-records-*.jsonl"
      - ".beads/beadtrains/scripts/validate_sharded_beadtrain.py"
      - ".github/workflows/house-cellar-threshold-beadtrain.yml"
  pull_request:
    paths:
      - ".beads/onyx_zork_house_cellar_threshold.beadtrain"
      - ".beads/issues-zork-house-of-records-*.jsonl"
      - ".beads/beadtrains/scripts/validate_sharded_beadtrain.py"
      - ".github/workflows/house-cellar-threshold-beadtrain.yml"

permissions:
  contents: read

jobs:
  validate-house-cellar-threshold-train:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate House Cellar Threshold train
        run: |
          python .beads/beadtrains/scripts/validate_sharded_beadtrain.py \
            .beads/onyx_zork_house_cellar_threshold.beadtrain
