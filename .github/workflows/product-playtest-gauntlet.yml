name: Zork I Product Playtest Gauntlet
on:
  push:
    branches: [agent/product-playtest-gauntlet-20260822]
    paths:
      - "glulx/product-playtest-gauntlet/**"
      - ".github/workflows/product-playtest-gauntlet.yml"
  pull_request:
    branches: [agent/mara-field-guidance-1276-20260821]
    paths:
      - "glulx/product-playtest-gauntlet/**"
      - ".github/workflows/product-playtest-gauntlet.yml"
  workflow_dispatch:
concurrency:
  group: zork-product-playtest-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PLAYTEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  ZORK_GLULX_COMMIT: 1ada70e58ac4933446b907d67949d9cab3119c0e
  GLULX_ZILF_COMMIT: 45c60f1e37651f266ac92d49ae01748bb4909fa5
  GLAZER_SOURCE_URL: https://gitlab.com/andwj/glazer/-/archive/v1.2.0/glazer-v1.2.0.tar.gz
  GLAZER_SOURCE_SHA256: a45edadb140111b5df44a3f49ca4e2b8ec0550d63a6cdee7c93bec93a79ed482
  GLULXE_COMMIT: 56ab8743bab565de307bd892c555d8d8897ed517
  CHEAPGLK_COMMIT: 14d8aaf6e4150669762bd4646a5368e75c1eeee6
jobs:
  house-full-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PLAYTEST_REF }}
          persist-credentials: false
      - name: Verify exact playtest checkout
        run: '[[ "$(git rev-parse HEAD)" == "$PLAYTEST_REF" ]]'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.302"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: taradinoc/zork1
          ref: "${{ env.ZORK_GLULX_COMMIT }}"
          path: .upstream/zork1-glulx
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: taradinoc/zilf
          ref: "${{ env.GLULX_ZILF_COMMIT }}"
          path: .tooling/zilf-glulx
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: erkyrath/glulxe
          ref: "${{ env.GLULXE_COMMIT }}"
          path: .tooling/glulxe
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: erkyrath/cheapglk
          ref: "${{ env.CHEAPGLK_COMMIT }}"
          path: .tooling/cheapglk
          persist-credentials: false
      - name: Prepare Glazer
        run: |
          mkdir -p .tooling/glazer-source
          curl --fail --location --silent --show-error "$GLAZER_SOURCE_URL" --output glazer.tar.gz
          echo "$GLAZER_SOURCE_SHA256  glazer.tar.gz" | sha256sum --check
          tar -xf glazer.tar.gz --strip-components=1 -C .tooling/glazer-source
          make -C .tooling/glazer-source
      - name: Install prompt-aware play driver dependency
        run: python -m pip install --disable-pip-version-check pexpect==4.9.0
      - name: Rebuild and requalify exact locked Release 1276 product
        run: |
          set -o pipefail
          bash glulx/mara-field-guidance/qualify.sh 2>&1 | tee product-build-and-1276-qualification.log
      - name: Play full House journey
        run: |
          set -o pipefail
          bash glulx/product-playtest-gauntlet/run-house-full-journey.sh 2>&1 | tee house-full-journey.log
      - name: Upload House replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: house-full-journey-${{ env.PLAYTEST_REF }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            product-build-and-1276-qualification.log
            house-full-journey.log
            glulx/build/product-playtest-gauntlet/house/
