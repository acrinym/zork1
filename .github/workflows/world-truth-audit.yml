name: Extended Zork World Truth Contracts
on:
  pull_request:
    branches: [master]
    paths:
      - "*.zil"
      - "**/*.zil"
      - "tools/world_truth/**"
      - "tests/test_world_truth.py"
      - "world-truth.toml"
      - "reference/world-truth/**"
      - "docs/WORLD_TRUTH_SYSTEM.md"
      - ".github/workflows/world-truth-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world-truth-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Test World Truth
        run: python -m unittest discover -s tests -p "test_world_truth.py" -v
