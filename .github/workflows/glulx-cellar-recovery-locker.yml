name: Zork I Glulx Cellar Recovery Locker

on:
  push:
    branches:
      - agent/cellar-recovery-locker-20260801
    paths:
      - "glulx/cellar-recovery-locker/**"
      - "tests/test_cellar_recovery_locker.py"
      - ".github/workflows/glulx-cellar-recovery-locker.yml"
  pull_request:
    paths:
      - "glulx/cellar-recovery-locker/**"
      - "tests/test_cellar_recovery_locker.py"
      - ".github/workflows/glulx-cellar-recovery-locker.yml"
  workflow_dispatch:

concurrency:
  group: glulx-cellar-recovery-locker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZORK_GLULX_COMMIT: 1ada70e58ac4933446b907d67949d9cab3119c0e
  GLULX_ZILF_COMMIT: 45c60f1e37651f266ac92d49ae01748bb4909fa5
  GLAZER_SOURCE_URL: https://gitlab.com/andwj/glazer/-/archive/v1.2.0/glazer-v1.2.0.tar.gz
  GLAZER_SOURCE_SHA256: a45edadb140111b5df44a3f49ca4e2b8ec0550d63a6cdee7c93bec93a79ed482
  GLULXE_COMMIT: 56ab8743bab565de307bd892c555d8d8897ed517
  CHEAPGLK_COMMIT: 14d8aaf6e4150669762bd4646a5368e75c1eeee6

jobs:
  qualify-release-1238:
    name: qualify-glulx-cellar-recovery-locker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"
      - run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev curl
      - uses: actions/checkout@v4
        with:
          repository: taradinoc/zork1
          ref: ${{ env.ZORK_GLULX_COMMIT }}
          path: .upstream/zork1-glulx
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: taradinoc/zilf
          ref: ${{ env.GLULX_ZILF_COMMIT }}
          path: .tooling/zilf-glulx
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: erkyrath/glulxe
          ref: ${{ env.GLULXE_COMMIT }}
          path: .tooling/glulxe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: erkyrath/cheapglk
          ref: ${{ env.CHEAPGLK_COMMIT }}
          path: .tooling/cheapglk
          persist-credentials: false
      - name: Prepare Glazer
        run: |
          mkdir -p .tooling/glazer-source
          curl --fail --location --silent --show-error "$GLAZER_SOURCE_URL" --output glazer.tar.gz
          echo "$GLAZER_SOURCE_SHA256  glazer.tar.gz" | sha256sum --check
          tar -xf glazer.tar.gz --strip-components=1 -C .tooling/glazer-source
          make -C .tooling/glazer-source
      - name: Play and qualify Release 1238
        run: bash glulx/cellar-recovery-locker/qualify.sh
      - name: Upload gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellar-recovery-locker-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            glulx/build/cellar-recovery-locker/*.ulx
            glulx/build/cellar-recovery-locker/*.asm
            glulx/build/cellar-recovery-locker/*.json
            glulx/build/cellar-recovery-locker/*.txt
            glulx/build/cellar-recovery-locker/*.log
            glulx/build/cellar-recovery-locker/src/STAGING-RECEIPT.json
            glulx/cellar-recovery-locker/patch-series.json
