format_version = 1

[policy]
law = "If player-facing prose says a thing exists, the parser and world model must answer honestly."
candidate_findings_are_debt = true
runtime_probes_are_isolated = true
probe_inferred_interactions = true
start_room = "WEST-OF-HOUSE"
required_staging_receipt = true
required_includes = ["empire_nouns"]
probe_default_allowed = ["recognized-specific", "subject-refusal", "generic-refusal"]
runtime_required_output = ["ZORK I: The Great Underground Empire"]
forbidden_setup_prefixes = ["survey", "svy", "alt"]

[[probe_rules]]
verbs = ["EXAMINE", "LOOK", "READ"]
allowed = ["recognized-specific", "subject-refusal"]

[[probe_rules]]
verbs = ["TAKE", "OPEN"]
flags_any = ["NDESCBIT", "TRYTAKEBIT"]
allowed = ["recognized-specific", "subject-refusal"]

[[probe_rules]]
verbs = ["TIE", "PUT", "ASK", "TELL", "GIVE"]
kinds = ["two-object", "conversation", "actor-command"]
allowed = ["recognized-specific", "subject-refusal"]

[[probe_rules]]
verbs = ["TAKE", "OPEN", "CLOSE", "ENTER", "CLIMB", "PUSH", "PULL", "ATTACK", "WEAR", "DRINK", "EAT", "BURN", "LIGHT", "EXTINGUISH", "TOUCH", "BOARD", "DISEMBARK", "HELLO", "LISTEN"]
allowed = ["recognized-specific", "subject-refusal", "generic-refusal"]

